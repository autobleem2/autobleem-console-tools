# autobleem-console-tools CI: build pscbios + abflashkit against the autobleem-core submodule in the shared
# image. NOTE: the submodule checkout needs autobleem-core to be public (a repo's GITHUB_TOKEN cannot read
# other private org repos) - as libpicofe is public for pcsx-abnxt. Gated by AB_CI_ENABLED.
name: build
on:
  push:
    branches: [develop, master]
    tags: ['v*']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/autobleem2/autobleem-build:${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || 'develop' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4

  plan:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else echo "version=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi

  kernel-payload:
    # ABFlashKit's kernel/ (boot.img + abrootfs.tgz + recovery images + install_payload.sh) from
    # autobleem2/psc-kernel-payload's releases - built from source there, the 2020 files checked in under
    # payload/Apps/abflashkit/kernel only a fallback. A tag build takes the payload released under the same
    # tag and fails without one (a release must not quietly ship the old payload); a branch build takes the
    # newest payload release, or the checked-in files when there is none yet. Assets are listed by release
    # id: GitHub's tag view can go on missing an asset uploaded after publishing.
    if: vars.AB_CI_ENABLED == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.p.outputs.source }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R=autobleem2/psc-kernel-payload
          mkdir -p kp
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # gh prints the error body on stdout for a 404 - only a number is an id
            id="$(gh api "repos/$R/releases/tags/$GITHUB_REF_NAME" --jq .id 2>/dev/null)" || id=""
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::no $R release $GITHUB_REF_NAME - tag the payload first"; exit 1; }
          else
            ids="$(gh api "repos/$R/releases" --jq '.[] | select(.draft|not) | .id')"
            id=""
            for i in $ids; do
              if gh api "repos/$R/releases/$i/assets" --jq '.[].name' | grep -q '^kernel-payload-psc-'; then id="$i"; break; fi
            done
            if [ -z "$id" ]; then
              echo "::warning::no psc-kernel-payload release yet - the checked-in 2020 payload is used"
              echo "source=checked-in" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          assets="$(gh api "repos/$R/releases/$id/assets" --paginate --jq '.[] | select(.name | startswith("kernel-payload-psc-")) | "\(.id) \(.name)"')"
          [ -n "$assets" ] || { echo "::error::$R release $id has no kernel-payload-psc asset"; exit 1; }
          aid="${assets%% *}"; name="${assets#* }"; name="${name%%$'\n'*}"
          gh api -H 'Accept: application/octet-stream' "repos/$R/releases/assets/$aid" > "kp/$name"
          tar -tzf "kp/$name" kernel/boot.img kernel/abrootfs.tgz > /dev/null
          tag="$(gh api "repos/$R/releases/$id" --jq .tag_name)"
          echo "payload: $name from $R@$tag"
          echo "source=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.p.outputs.source != 'checked-in'
        with:
          name: kernel-payload-psc
          path: kp/*.tar.gz
          retention-days: 7

  psc:
    # cross-compiles pscbios+abflashkit for the console (AB_TARGET=psc, ported into this repo + the
    # autobleem-core submodule 2026-09-23 - see their CMakeLists.txt comments) and publishes
    # console-tools-psc-<version>.tar.gz, laid out as Apps/{pscbios,abflashkit}/ - what the PSC assembler
    # will extract straight into the payload. Uses the image's proven gcc-6 toolchain (/opt/psc), the same
    # one the launcher's own psc target builds with and that has run on real console hardware.
    if: vars.AB_CI_ENABLED == 'true'
    needs: [plan, kernel-payload]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/autobleem2/autobleem-build:${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || 'develop' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SCCACHE_DIR: /sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Restore sccache cache
        uses: actions/cache@v6
        with:
          path: /sccache
          key: sccache-console-psc-${{ github.sha }}
          restore-keys: sccache-console-psc-
      - name: Configure (psc, /opt/psc toolchain)
        run: |
          cmake -S . -B build_psc -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=toolchains/psc/PSCtoolchainV8.cmake -DAB_PSC_TOOLCHAIN=/opt/psc \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        run: ninja -C build_psc
      - name: Check the binaries against the console's glibc 2.24 / GLIBCXX 3.4.22, no RPATH
        run: |
          bash tools/check_psc_binary.sh build_psc/apps/pscbios/pscbios /opt/psc
          bash tools/check_psc_binary.sh build_psc/apps/abflashkit/abflashkit /opt/psc
      - uses: actions/download-artifact@v8
        if: needs.kernel-payload.outputs.source != 'checked-in'
        with:
          name: kernel-payload-psc
          path: kp
      - name: Package
        id: stage
        run: |
          set -e
          V="${{ needs.plan.outputs.version }}"
          rm -rf stage out && mkdir -p stage/Apps/pscbios stage/Apps/abflashkit out
          for tool in pscbios abflashkit; do
            # payload/Apps/<tool>/ first: it holds what resources/ deliberately doesn't - abflashkit's
            # kernel/ (boot.img, abrootfs.tgz, the recovery images, install_payload.sh), the release
            # artefacts the tool flashes. Then resources/ over it (the maintained copy wins), then the
            # fresh binary over the stale checked-in one.
            cp -a "payload/Apps/$tool/." "stage/Apps/$tool/"
            cp -a "apps/$tool/resources/." "stage/Apps/$tool/"
            cp "build_psc/apps/$tool/$tool" "stage/Apps/$tool/$tool"
            upx -q --best --lzma "stage/Apps/$tool/$tool" || true
          done
          # the kernel payload from psc-kernel-payload's release replaces the checked-in 2020 one (kernel-payload job)
          if [ "${{ needs.kernel-payload.outputs.source }}" != checked-in ]; then
            rm -rf stage/Apps/abflashkit/kernel
            tar -xzf kp/kernel-payload-psc-*.tar.gz -C stage/Apps/abflashkit
            echo "ABFlashKit kernel/: psc-kernel-payload ${{ needs.kernel-payload.outputs.source }}"
          else
            echo "ABFlashKit kernel/: the checked-in 2020 payload"
          fi
          # ABFlashKit is useless without its payload - never ship one that lacks it
          for f in boot.img boot.md5 abrootfs.tgz install_payload.sh recovery-on.img recovery-off.img; do
            test -s "stage/Apps/abflashkit/kernel/$f" || { echo "::error::Apps/abflashkit/kernel/$f missing"; exit 1; }
          done
          (cd stage/Apps/abflashkit/kernel && [ "$(md5sum boot.img | cut -c1-32)" = "$(head -c 32 boot.md5)" ]) \
            || { echo "::error::kernel/boot.img does not match boot.md5"; exit 1; }
          tar -czf "out/console-tools-psc-$V.tar.gz" -C stage .
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: console-tools-psc
          path: out/*.tar.gz
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plan, psc]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { pattern: console-tools-psc, path: out, merge-multiple: true }
      - name: Attach to the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          prerelease=""; case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "AutoBleem console tools ${GITHUB_REF_NAME}" --generate-notes $prerelease out/*.tar.gz || \
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" out/*.tar.gz --clobber

  # the rolling development build: every successful build of develop replaces the assets of this repository's
  # `nightly` pre-release (autobleem-build's nightly-release action), which autobleem-appliance's nightly
  # assembly fetches the way it fetches a v* release. Never for a pull request or a tag.
  nightly:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: [plan, psc]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { pattern: console-tools-psc, path: out, merge-multiple: true }
      - uses: autobleem2/autobleem-build/.github/actions/nightly-release@develop
        with:
          files: out/*.tar.gz
          version: ${{ needs.plan.outputs.version }}
