# autobleem-console-tools CI: PSC-Bios (an extension of the launcher) and ABFlashKit (an App), built against
# the autobleem-core submodule in the shared image. NOTE: the submodule checkout needs autobleem-core to be
# public (a repo's GITHUB_TOKEN cannot read other private org repos) - as libpicofe is public for
# pcsx-abnxt. Gated by AB_CI_ENABLED.
name: build
on:
  push:
    branches: [develop, master]
    tags: ['v*']
  pull_request:
    branches: [develop, master]
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk-abi:
    # PSC-Bios is an extension the launcher checks the AB_SDK_ABI of before loading it: one built against
    # another ABI than the launcher it ships with is refused on the console. Our autobleem-core must be at
    # the launcher's AB_SDK_ABI - the launcher's develop (a v* tag: its master, what a release ships). On the
    # plain runner: the build image has no gh. The psc package waits for it.
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: PSC-Bios matches the launcher's SDK
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          ref=develop; [[ "$GITHUB_REF" == refs/tags/v* ]] && ref=master
          core=$(gh api "repos/autobleem2/autobleem/contents/autobleem-core?ref=$ref" --jq .sha)
          theirs=$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/autobleem2/autobleem-core/contents/src/code/gui/extension.h?ref=$core" | sed -n 's/^#define AB_SDK_ABI \([0-9]*\).*/\1/p')
          ours=$(sed -n 's/^#define AB_SDK_ABI \([0-9]*\).*/\1/p' autobleem-core/src/code/gui/extension.h)
          echo "AB_SDK_ABI: ours $ours, the launcher's $ref (core $core) $theirs"
          [ -n "$theirs" ] && [ "$ours" = "$theirs" ] || { echo "::error::bump autobleem-core to the launcher's (AB_SDK_ABI $theirs)"; exit 1; }

  build:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/autobleem2/autobleem-build:${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || 'develop' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j4

  plan:
    if: vars.AB_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else echo "version=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi

  kernel-payload:
    # ABFlashKit's kernel/ (boot.img + abrootfs.tgz + recovery images + install_payload.sh) from
    # autobleem2/psc-kernel-payload's releases - built from source there, the 2020 files checked in under
    # payload/Apps/abflashkit/kernel are never used by CI any more (R1: a silent fallback to them here is
    # exactly what would let a develop build quietly ship stale flashing data once the payload's old
    # v2.0.0-alpha2/alpha3 releases are deleted). A tag build takes the payload released under the same tag;
    # any other build (develop, master, a pull request, a manual run) takes the payload's rolling `nightly`
    # release (see psc-kernel-payload's build.yml `nightly` job). Either way, a missing release or a missing
    # kernel-payload-psc-* asset on it fails the job loudly - there is no fallback path left. Assets are
    # listed by release id: GitHub's tag view can go on missing an asset uploaded after publishing.
    if: vars.AB_CI_ENABLED == 'true'
    needs: plan
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.p.outputs.source }}
    steps:
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R=autobleem2/psc-kernel-payload
          mkdir -p kp
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=nightly
          fi
          # gh prints the error body on stdout for a 404 - only a number is an id
          id="$(gh api "repos/$R/releases/tags/$tag" --jq .id 2>/dev/null)" || id=""
          [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::no $R release '$tag' - $([ "$tag" = nightly ] && echo 'push the payload to develop first (its nightly job publishes this release)' || echo 'tag the payload first')"; exit 1; }
          assets="$(gh api "repos/$R/releases/$id/assets" --paginate --jq '.[] | select(.name | startswith("kernel-payload-psc-")) | "\(.id) \(.name)"')"
          [ -n "$assets" ] || { echo "::error::$R release $tag (id $id) has no kernel-payload-psc asset"; exit 1; }
          aid="${assets%% *}"; name="${assets#* }"; name="${name%%$'\n'*}"
          gh api -H 'Accept: application/octet-stream' "repos/$R/releases/assets/$aid" > "kp/$name"
          tar -tzf "kp/$name" kernel/boot.img kernel/abrootfs.tgz > /dev/null
          echo "payload: $name from $R@$tag"
          echo "source=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: kernel-payload-psc
          path: kp/*.tar.gz
          retention-days: 7

  psc:
    # cross-compiles pscbios+abflashkit for the console (AB_TARGET=psc, ported into this repo + the
    # autobleem-core submodule 2026-09-23 - see their CMakeLists.txt comments) and publishes
    # console-tools-psc-<version>.tar.gz, laid out as Extensions/pscbios/ + Apps/abflashkit/ - what the PSC
    # assembler extracts straight into the payload. Uses the image's proven gcc-6 toolchain (/opt/psc), the same
    # one the launcher's own psc target builds with and that has run on real console hardware.
    if: vars.AB_CI_ENABLED == 'true'
    needs: [plan, kernel-payload, sdk-abi]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/autobleem2/autobleem-build:${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || 'develop' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SCCACHE_DIR: /sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Restore sccache cache
        uses: actions/cache@v6
        with:
          path: /sccache
          key: sccache-console-psc-${{ github.sha }}
          restore-keys: sccache-console-psc-
      - name: Configure (psc, /opt/psc toolchain)
        run: |
          cmake -S . -B build_psc -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=toolchains/psc/PSCtoolchainV8.cmake -DAB_PSC_TOOLCHAIN=/opt/psc \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        run: ninja -C build_psc
      - name: Check the binaries against the console's glibc 2.24 / GLIBCXX 3.4.22, no RPATH
        run: |
          bash tools/check_psc_binary.sh build_psc/extensions/pscbios/bin/psc/pscbios.so /opt/psc
          bash tools/check_psc_binary.sh build_psc/apps/abflashkit/abflashkit /opt/psc
          # a plugin carries none of the SDK (the launcher's copy is the one) and exports its two entry points
          bash tools/check_extension.sh build_psc/extensions/pscbios/bin/psc/pscbios.so /opt/psc
      - uses: actions/download-artifact@v8
        with:
          name: kernel-payload-psc
          path: kp
      - name: Package
        id: stage
        run: |
          set -e
          V="${{ needs.plan.outputs.version }}"
          rm -rf stage out && mkdir -p stage/Extensions stage/Apps/abflashkit out
          # PSC-Bios, an extension (2026-09-24): the folder ab_add_extension staged - extension.ini, the icon,
          # lang/, its files and bin/psc/pscbios.so. Not UPX-packed: a packed shared library does not load.
          cp -a build_psc/extensions/pscbios stage/Extensions/pscbios
          # ABFlashKit, an App: payload/Apps/abflashkit/ first - it holds what resources/ deliberately doesn't,
          # the kernel/ (boot.img, abrootfs.tgz, the recovery images, install_payload.sh) the tool flashes. Then
          # resources/ over it (the maintained copy wins), then the fresh binary over the stale checked-in one.
          cp -a payload/Apps/abflashkit/. stage/Apps/abflashkit/
          cp -a apps/abflashkit/resources/. stage/Apps/abflashkit/
          cp build_psc/apps/abflashkit/abflashkit stage/Apps/abflashkit/abflashkit
          upx -q --best --lzma stage/Apps/abflashkit/abflashkit || true
          # the kernel payload from psc-kernel-payload's release always replaces the checked-in 2020 one now
          # (kernel-payload job; R1 - no silent fallback to it is left on any path)
          rm -rf stage/Apps/abflashkit/kernel
          tar -xzf kp/kernel-payload-psc-*.tar.gz -C stage/Apps/abflashkit
          echo "ABFlashKit kernel/: psc-kernel-payload ${{ needs.kernel-payload.outputs.source }}"
          # ABFlashKit is useless without its payload - never ship one that lacks it
          for f in boot.img boot.md5 abrootfs.tgz install_payload.sh recovery-on.img recovery-off.img; do
            test -s "stage/Apps/abflashkit/kernel/$f" || { echo "::error::Apps/abflashkit/kernel/$f missing"; exit 1; }
          done
          (cd stage/Apps/abflashkit/kernel && [ "$(md5sum boot.img | cut -c1-32)" = "$(head -c 32 boot.md5)" ]) \
            || { echo "::error::kernel/boot.img does not match boot.md5"; exit 1; }
          tar -czf "out/console-tools-psc-$V.tar.gz" -C stage .
          ls -l out
      - uses: actions/upload-artifact@v7
        with:
          name: console-tools-psc
          path: out/*.tar.gz
          retention-days: 30

  linux:
    # PSC-Bios for a Raspberry Pi (32- and 64-bit) and the PC stick (2026-09-26): its Network & Controllers
    # screens run there over NetworkManager and BlueZ. AB_TARGET comes from the toolchain file (the
    # launcher's, copied into toolchains/ - Debian's multiarch cross compilers in the image), which builds
    # PSC-Bios alone; console-tools-<target>-<version>.tar.gz holds Extensions/pscbios/ with bin/<target>/,
    # what autobleem-appliance's assemble.sh puts into the Pi and PC-stick packages (extensions/pscbios/).
    if: vars.AB_CI_ENABLED == 'true'
    needs: [plan, sdk-abi]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: rpi, toolchain: toolchains/rpi/RPitoolchain.cmake }
          - { target: rpi64, toolchain: toolchains/rpi64/RPi64toolchain.cmake }
          - { target: pcusb, toolchain: toolchains/pcusb/PcUsbToolchain.cmake }
    container:
      image: ghcr.io/autobleem2/autobleem-build:${{ startsWith(github.ref, 'refs/tags/v') && 'latest' || 'develop' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SCCACHE_DIR: /sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Restore sccache cache
        uses: actions/cache@v6
        with:
          path: /sccache
          key: sccache-console-${{ matrix.target }}-${{ github.sha }}
          restore-keys: sccache-console-${{ matrix.target }}-
      - name: Configure (${{ matrix.target }})
        run: |
          cmake -S . -B build_${{ matrix.target }} -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }} \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        run: ninja -C build_${{ matrix.target }} pscbios
      - name: Check the plugin
        run: |
          set -e
          so=build_${{ matrix.target }}/extensions/pscbios/bin/${{ matrix.target }}/pscbios.so
          file "$so"
          # a plugin carries none of the SDK (the launcher's copy is the one) and exports its two entry points
          bash tools/check_extension.sh "$so"
          # the stamp the launcher compares before loading it names this target
          grep -aq "target=${{ matrix.target }}" "$so" || { echo "::error::$so's SDK stamp is not for ${{ matrix.target }}"; exit 1; }
      - name: Package
        run: |
          set -e
          V="${{ needs.plan.outputs.version }}"
          rm -rf stage out && mkdir -p stage/Extensions out
          # the folder ab_add_extension staged: extension.ini, the icon, lang/, DS3.png and bin/<target>/ - no
          # `bt` any more (native-backend work: NmBackend pairs through BluezClient, never a shell script)
          cp -a build_${{ matrix.target }}/extensions/pscbios stage/Extensions/pscbios
          tar -czf "out/console-tools-${{ matrix.target }}-$V.tar.gz" -C stage .
          tar -tzf out/*.tar.gz | head -20
      - uses: actions/upload-artifact@v7
        with:
          name: console-tools-${{ matrix.target }}
          path: out/*.tar.gz
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plan, psc, linux]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { pattern: console-tools-*, path: out, merge-multiple: true }
      - name: Attach to the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          prerelease=""; case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "AutoBleem console tools ${GITHUB_REF_NAME}" --generate-notes $prerelease out/*.tar.gz || \
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" out/*.tar.gz --clobber

  # the rolling development build: every successful build of develop replaces the assets of this repository's
  # `nightly` pre-release (autobleem-build's nightly-release action), which autobleem-appliance's nightly
  # assembly fetches the way it fetches a v* release. Never for a pull request or a tag.
  nightly:
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: [plan, psc, linux]
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { pattern: console-tools-*, path: out, merge-multiple: true }
      # the admin App's token, so the new nightly starts autobleem-appliance's assembly at once (a repository
      # without AB_ADMIN_APP_ID skips this, and the appliance's schedule assembles it instead)
      - id: app
        if: vars.AB_ADMIN_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AB_ADMIN_APP_ID }}
          private-key: ${{ secrets.AB_ADMIN_APP_KEY }}
          owner: autobleem2
          repositories: autobleem-appliance
      - uses: autobleem2/autobleem-build/.github/actions/nightly-release@develop
        with:
          files: out/*.tar.gz
          version: ${{ needs.plan.outputs.version }}
          dispatch-token: ${{ steps.app.outputs.token }}
