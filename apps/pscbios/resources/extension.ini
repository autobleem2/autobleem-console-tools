[extension]
Name=PSC-Bios
Description=Wi-Fi, time zone, Bluetooth and gamepads
Author=AutoBleem team
Version=2.0.0
# resolved by AppManifest's rule; .so is added. The console (the kernel's abnet), a Pi and the PC stick
# (NetworkManager + BlueZ); not Windows
Plugin=bin/{key}/pscbios
# the launcher's Network & Controllers item opens it at its hub (Extension::runEntry("network"), SDK ABI 4)
Provides=network
Icon=icon.png
# works offline (it is where the WiFi gets set up); nothing to do while the carousel shows
Network=none
